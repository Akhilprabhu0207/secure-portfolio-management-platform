server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DATABASE_USERNAME:portfolio}
    password: ${DATABASE_PASSWORD:portfolio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt-secret: ${JWT_SECRET:development-only-secret-must-be-at-least-32-bytes}
  jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
